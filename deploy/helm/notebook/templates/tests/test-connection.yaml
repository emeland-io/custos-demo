apiVersion: v1
kind: Pod
metadata:
  name: {{ include "notebook.fullname" . }}-test-connection
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      args:
        - "-sf"
        - "http://{{ include "notebook.fullname" . }}:{{ .Values.service.port }}/healthz"
