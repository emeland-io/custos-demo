apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "notebook.fullname" . }}
  labels:
    {{- include "notebook.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "notebook.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
